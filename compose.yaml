services:
  postgres:
    image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
    environment:
      POSTGRES_DB: aegra
      POSTGRES_USER: aegra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegra -d aegra"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine@sha256:e8eb6f2980c06c6a25c08f62cb2e00dc7d2fead9aa492cfdd8b54a42109ae0f2
    command: ["/bin/sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  aegra:
    build: .
    environment:
      AEGRA_CONFIG: /app/aegra.json
      AEGRA_API_KEY: ${AEGRA_API_KEY:?Set AEGRA_API_KEY}
      AUTH_TYPE: custom
      DEBUG: "false"
      ENV_MODE: PRODUCTION
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: "2026"
      SERVER_URL: http://localhost:2026
      POSTGRES_DB: aegra
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_PORT: "5432"
      POSTGRES_USER: aegra
      DB_ECHO_LOG: "false"
      SQLALCHEMY_POOL_SIZE: "5"
      SQLALCHEMY_MAX_OVERFLOW: "5"
      LANGGRAPH_MIN_POOL_SIZE: "2"
      LANGGRAPH_MAX_POOL_SIZE: "10"
      REDIS_BROKER_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      WORKER_COUNT: "2"
      N_JOBS_PER_WORKER: "4"
      CRON_ENABLED: "true"
      ENABLE_PROMETHEUS_METRICS: "false"
      OTEL_TARGETS: ""
      OTEL_CONSOLE_EXPORT: "false"
    ports:
      - "2026:2026"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:2026/ready"]
      interval: 10s
      timeout: 5s
      retries: 60

volumes:
  postgres-data:
  redis-data:
